<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        header {
            text-align: center;
        }

        section {
            margin-top: 30px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }

        footer {
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Taskly</h1>
        <p>Your simple daily task manager</p>
    </header>

    <main>

        <section>
            <h2>Add a Task</h2>

            <input type="text" placeholder="Enter your task">
            <button>Add Task</button>
        </section>

        <section>
            <h2>My Tasks</h2>

            <ul>
                <li>Learn HTML</li>
                <li>Practice Python</li>
                <li>Study SQL</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Taskly</p>
    </footer>

</body>
</html>
