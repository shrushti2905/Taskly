<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="stylesheet" href="style.css">

</head>
<script src="script.js"></script>
<body>

    <header>
        <h1>Taskly</h1>
        <p>Your simple daily task manager</p>
    </header>

    <main>

        <section>
            <h2>Add a Task</h2>

            <input type="text" placeholder="Enter your task">
            <button>Add Task</button>
        </section>

        <section>
            <h2>My Tasks</h2>

            <ul>
                <li>Learn HTML</li>
                <li>Practice Python</li>
                <li>Study SQL</li>
            </ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Taskly</p>
    </footer>

</body>
</html>
